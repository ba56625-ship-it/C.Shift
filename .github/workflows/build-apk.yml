name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 tailwindcss@3.4.17
          echo '{"appId":"com.shifts.calculator","appName":"حاسبة الشيفتات","webDir":"www","backgroundColor":"#0f172a"}' > capacitor.config.json
          echo "module.exports={content:['./index.html'],theme:{extend:{fontFamily:{sans:['Cairo','sans-serif']}}}}" > tailwind.config.js
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > input.css
      - name: Build web
        run: |
          mkdir -p www/fonts
          cat > fonts.mjs <<'JS'
          import { writeFile } from 'node:fs/promises';
          const ua = 'Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120.0 Mobile Safari/537.36';
          let css = await (await fetch('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap', { headers: { 'User-Agent': ua } })).text();
          const urls = [...new Set([...css.matchAll(/url\((https:[^)]+)\)/g)].map(m => m[1]))];
          let i = 0;
          for (const u of urls) {
            const n = `cairo-${++i}.woff2`;
            await writeFile(`www/fonts/${n}`, Buffer.from(await (await fetch(u)).arrayBuffer()));
            css = css.split(u).join(`fonts/${n}`);
          }
          await writeFile('www/fonts.css', css);
          JS
          node fonts.mjs
          npx tailwindcss -c tailwind.config.js -i input.css -o www/tailwind.css --minify
          cp index.html www/index.html
      - name: Build Android
        run: |
          npx cap add android
          npx cap sync android
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: shift-calculator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
