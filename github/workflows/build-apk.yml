    /**
     * آلية نسخ مزدوجة وموثوقة 100% تعمل في كل المتصفحات وداخل الإطارات المقيدة (Sandboxed Iframes)
     */
    function fallbackExecCommandCopy(text) {
      const textArea = document.createElement('textarea');
      textArea.value = text;
      textArea.setAttribute('readonly', '');
      textArea.style.position = 'fixed';
      textArea.style.top = '0';
      textArea.style.left = '0';
      textArea.style.width = '2em';
      textArea.style.height = '2em';
      textArea.style.padding = '0';
      textArea.style.border = 'none';
      textArea.style.outline = 'none';
      textArea.style.boxShadow = 'none';
      textArea.style.background = 'transparent';
      textArea.style.opacity = '0';

      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      textArea.setSelectionRange(0, 999999);

      let copied = false;
      try {
        copied = document.execCommand('copy');
      } catch (err) {
        copied = false;
      }
      document.body.removeChild(textArea);
      return copied;
    }

    function copyTextToClipboard(text, successMessage, whatsappShareText = null) {
      if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
        navigator.clipboard.writeText(text)
          .then(() => {
            showToast(successMessage, false, whatsappShareText);
          })
          .catch(() => {
            const ok = fallbackExecCommandCopy(text);
            showToast(
              ok ? successMessage : 'الرسالة جاهزة بالأسفل — اضغط إرسال عبر واتساب أو تحديد الكل',
              false,
              whatsappShareText
            );
          });
      } else {
        const ok = fallbackExecCommandCopy(text);
        showToast(
          ok ? successMessage : 'الرسالة جاهزة بالأسفل — اضغط إرسال عبر واتساب أو تحديد الكل',
          false,
          whatsappShareText
        );
      }
    }

    function showToast(message, allowUndo, whatsappShareText = null) {
      const container = document.getElementById('toast-container');
      if (!container) return;

      if (toastTimeout) clearTimeout(toastTimeout);

      let actionBtnHtml = '';
      if (allowUndo) {
        actionBtnHtml = `<button type="button" onclick="undoLastReset()" class="bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold text-xs px-3 py-1.5 rounded-lg shrink-0 cursor-pointer transition-colors">تراجع</button>`;
      } else if (whatsappShareText) {
        const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(whatsappShareText)}`;
        actionBtnHtml = `<a href="${waUrl}" target="_blank" rel="noopener noreferrer" class="bg-[#25D366] hover:bg-[#20bd5a] text-slate-950 font-black text-xs px-3 py-1.5 rounded-lg shrink-0 cursor-pointer transition-colors">إرسال عبر واتساب</a>`;
      }

      container.innerHTML = `
        <div class="toast-animate pointer-events-auto bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-xl border border-slate-700 flex items-center justify-between gap-3">
          <span class="text-xs sm:text-sm font-bold leading-snug">${message}</span>
          ${actionBtnHtml}
        </div>
      `;

      toastTimeout = setTimeout(() => {
        container.innerHTML = '';
        undoBackup = null;
      }, 6000);
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });

    // تقليص البانر العلوي تلقائياً عند السحب للأسفل وإعادته عند العودة للأعلى
    let isHeaderShrunk = false;
    window.addEventListener('scroll', () => {
      const header = document.getElementById('main-header');
      const inner = document.getElementById('header-inner');
      if (!header || !inner) return;

      const y = window.scrollY || document.documentElement.scrollTop;
      if (y > 35 && !isHeaderShrunk) {
        isHeaderShrunk = true;
        header.classList.add('header-shrunk');
        inner.classList.remove('py-2');
        inner.classList.add('py-1');
      } else if (y < 12 && isHeaderShrunk) {
        isHeaderShrunk = false;
        header.classList.remove('header-shrunk');
        inner.classList.remove('py-1');
        inner.classList.add('py-2');
      }
    }, { passive: true });
  </script>
</body>
</html>
